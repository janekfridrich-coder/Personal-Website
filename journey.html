<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journey — Jan Fridrich</title>
<meta name="description" content="Places, schools, work and a few unexpected turns — Jan Fridrich's journey so far.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip-link" href="#main" data-i18n="skip">Skip to content</a>
<div id="site-header"></div>

<main id="main">

  <section class="container journey-hero">
    <span class="eyebrow reveal" data-i18n="eyebrow_journey">Journey</span>
    <h1 class="h-xl reveal" data-i18n-html="journey_hero_html">SO<br>FAR.</h1>
    <p class="lede reveal reveal-delay-1" style="margin-top:22px;" data-i18n="journey_lede">Places, schools, work and a few unexpected turns.</p>
  </section>

  <!-- Animated route map — built by js/journey.js from js/europe-map.js + SITE.journey -->
  <section class="jsection" style="margin-top:50px;">
    <div class="container">
      <span class="eyebrow reveal" id="jEyebrow"></span>
      <h2 class="h-xl reveal" id="jHeading"></h2>
    </div>
    <div class="container jwrap">
      <div class="jmap" id="jmap">
        <svg class="jmap-svg" id="jmapSvg" viewBox="0 0 1000 625" role="img" aria-labelledby="jmapTitle jmapDesc">
          <title id="jmapTitle"></title>
          <desc id="jmapDesc"></desc>
        </svg>
        <div class="jmap-controls">
          <button type="button" class="jbtn" id="jBtnEurope"></button>
          <button type="button" class="jbtn" id="jBtnCzechia"></button>
          <button type="button" class="jbtn" id="jBtnRoute"></button>
          <button type="button" class="jbtn jbtn-replay" id="jmapReplay"><span aria-hidden="true">↻</span><span></span></button>
        </div>
      </div>

      <ol class="jsteps" id="jsteps"></ol>

    </div>
  </section>

  <section class="section container">
    <span class="eyebrow reveal" data-i18n="eyebrow_timeline">Timeline</span>
    <h2 class="h-lg reveal" data-i18n="timeline_heading">A few milestones.</h2>
    <div class="vtimeline" id="vtimeline"></div>
  </section>

</main>

<div id="site-footer"></div>

<script src="js/content.js"></script>
<script src="js/i18n.js"></script>
<script>
  (function () {
    const vt = document.getElementById("vtimeline");
    if (vt) {
      vt.innerHTML = SITE.timeline.map(t => `
        <div class="vtimeline-item reveal">
          <div class="year">${t.year}</div>
          <h4>${t.label}</h4>
          ${t.note ? `<div class="note">→ ${t.note}</div>` : ""}
        </div>
      `).join("");
    }
  })();
</script>
<script src="js/europe-map.js"></script>
<script src="js/journey.js"></script>
<script src="js/main.js"></script>
</body>
</html>
