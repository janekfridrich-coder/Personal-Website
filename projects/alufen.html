<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alufen — Jan Fridrich</title>
<meta name="description" content="Alufen — from drawing to reality. A business built around aluminium fences and outdoor structures.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<a class="skip-link" href="#main" data-i18n="skip">Skip to content</a>
<div id="site-header"></div>

<main id="main">
  <section class="container pdetail-hero">
    <a href="../projects.html" class="hand" style="font-size:1rem; text-decoration:none;" data-i18n="all_projects">← All projects</a>
    <h1 class="h-xl reveal" style="margin-top:16px;" data-i18n-html="alufen_hero_html">FROM DRAWING<br>TO REALITY.</h1>
    <p class="lede reveal reveal-delay-1" style="margin-top:16px;" id="pIntro"></p>
    <div class="pdetail-meta reveal reveal-delay-1" id="pMeta"></div>
    <div class="pdetail-media reveal reveal-delay-2">
      <img src="../assets/project-alufen.jpg" alt="Alufen aluminium fence installation" style="width:100%;height:100%;object-fit:cover;filter:grayscale(.3) contrast(1.05);">
    </div>
  </section>

  <section class="section container" style="padding-bottom:0;">
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:40px; align-items:center;">
      <div class="reveal">
        <span class="eyebrow" data-i18n="eyebrow_from_drawing">From drawing to reality</span>
        <p class="body-text" data-i18n="alufen_drawing_body">Every panel starts as a custom drawing — exact dimensions, angles and mounting points — before it ever reaches the workshop.</p>
      </div>
      <div class="reveal reveal-delay-1" style="background:var(--bg-alt); border:1px solid var(--border-soft); display:flex; align-items:center; justify-content:center; padding:24px; aspect-ratio:16/10;">
        <img src="../assets/sketch-alufen.png" alt="Technical sketch of an aluminium pergola" style="width:88%; mix-blend-mode:screen; filter:drop-shadow(0 0 20px rgba(0,0,0,.5));">
      </div>
    </div>
  </section>

  <section class="section section-alt">
    <div class="container">
      <span class="eyebrow reveal" data-i18n="eyebrow_story">Story</span>
      <div class="pdetail-story" id="pStory"></div>
    </div>
  </section>

  <section class="section container">
    <span class="eyebrow reveal" data-i18n="eyebrow_focus">Focus</span>
    <div class="resp-tags reveal" id="pResp"></div>
    <a class="pdetail-external reveal" id="pExternal" href="#" target="_blank" rel="noopener"></a>
  </section>

</main>

<div id="site-footer"></div>

<script src="../js/content.js"></script>
<script src="../js/i18n.js"></script>
<script>
  (function () {
    const p = SITE.projects["alufen"];
    document.getElementById("pIntro").textContent = p.intro;
    document.getElementById("pMeta").innerHTML = `<span>${p.category}</span><span>${p.year}</span><span>${p.status}</span>`;
    document.getElementById("pStory").innerHTML = p.story.map(s => `<p>${s}</p>`).join("");
    document.getElementById("pResp").innerHTML = p.responsibilities.map(r => `<span>${r}</span>`).join("");
    const ext = document.getElementById("pExternal");
    ext.textContent = p.externalLabel + " ↗";
    ext.href = p.externalUrl;
  })();
</script>
<script src="../js/main.js"></script>
</body>
</html>
